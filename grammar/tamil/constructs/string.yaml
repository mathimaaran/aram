id: string
status: codegen
subset: Tamil-0.60
go_inspired: string
tamil_ebnf: |
  Type = "முழுஎண்" | "நிலை" | "சரம்" .
  # + concatenates சரம்; == / != compare lexicographically (C strcmp).
tamil_keywords:
  string: சரம்
ast:
  type: TypeName
  fields: [name]
semantics: >
  First-class string type. Variables, params, and results may be சரம்.
  Short declaration := infers சரம் from string literals and string-typed exprs.
  Operator + concatenates சரம் values. Tamil-0.60 flattens a + chain into one
  sized allocation, preserves left-to-right operand evaluation, and avoids
  allocation when zero or one component is non-empty (C backend).
  Operators == and != compare string contents. பதிப்பி prints சரம் with a newline.
examples:
  - tamil: |
      மாறி பெயர் சரம் = "நிரலுளி"
      பதிப்பி("வணக்கம், " + பெயர்)
    go_equivalent: |
      var name string = "நிரலுளி"
      println("வணக்கம், " + name)
