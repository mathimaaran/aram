id: generics
status: codegen
subset: Tamil-0.41
go_inspired: |
  func Identity[T any](x T) T { return x }
  func First[T, U any](a T, b U) U { return b }
  func Head[T any](xs []T) T { return xs[0] }
  pkg.Identity(5)
tamil_ebnf: |
  FunctionDecl = "செயல்பாடு" FunctionName [ TypeParams ] Signature FunctionBody .
  TypeParams   = "[" identifier { "," identifier } "]" .
  Call may use TypeArgs = "[" Type { "," Type } "]" before "(" .
semantics: >
  Unconstrained type parameters on functions only. Conventional name யா
  (and ஆ, …). Inference from arguments; explicit f[T](…) or f[T,U](…).
  Slice params []யா; exported generics via கொணர். C monomorphizes each
  instantiation. No constraints / any keyword.
examples:
  - tamil: |
      செயல்பாடு தலை[யா](xs []யா) யா { திருப்பு xs[0] }
      பதிப்பி(முதல்[சரம், முழுஎண்]("x", 99))
    go_equivalent: |
      func Head[T any](xs []T) T { return xs[0] }
      fmt.Println(First[string, int]("x", 99))
notes:
  - "Generic types, methods, and constraints are later."
  - "Tamil-0.41: multi-params, []யா, cross-package, f[T,U](…)."
