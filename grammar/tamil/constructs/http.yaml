id: http
status: codegen
subset: Tamil-0.56
go_inspired: |
  http.ListenAndServe(":8080", http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      w.Header().Set("Content-Type", "text/plain")
      w.Write([]byte("hi"))
  }))
tamil_keywords: {}
tamil_ebnf: |
  # no new syntax — stdlib package பரிமாற்றம் (கொணர் "பரிமாற்றம்")
semantics: >
  Tamil-0.56 provides a minimal HTTP/1.0 server via stdlib package பரிமாற்றம்
  (Go net/http shaped; no Handler interface yet). Types: கோரிக்கை (method/
  path/body/headers), பதிலளிப்பு (response writer = conn fd), கையாளு = function
  type செயல்பாடு(கோரிக்கை, பதிலளிப்பு). எழுது / எழுதுசரம் write status +
  Content-Type + body. சேவைஒன்று(listener, handler) accepts one connection.
  கேட்டுசேவை(addr, handler) listens forever and handles each conn on a
  new thread. Parsing is request-line + Content-Length body only. எழுது,
  எழுதுசரம், சேவைஒன்று, and கேட்டுசேவை return *வலை.பிழை; success is இன்மை.
  கோரிக்கை.தலைப்புகள் is an அகராதி[சரம்]சரம் with lowercase names and
  last-value-wins duplicates. URL queries are removed from கோரிக்கை.பாதை.
  வழிப்படுத்தி provides exact-path பதிவு plus one-shot/long-running
  வழிசேவை; registering a path again replaces its handler, and misses return
  404. Register routes before serving. No new keywords. Client / TLS later.
examples:
  - tamil: |
      கொணர் "பரிமாற்றம்"
      வழி := பரிமாற்றம்.புதியவழிப்படுத்தி()
      பரிமாற்றம்.பதிவு(வழி, "/", செயல்பாடு(கோ பரிமாற்றம்.கோரிக்கை, ப பரிமாற்றம்.பதிலளிப்பு) {
          பரிமாற்றம்.எழுதுசரம்(ப, 200, "text/plain; charset=utf-8",
              கோ.தலைப்புகள்["user-agent"])
      })
      பிழை := பரிமாற்றம்.வழிசேவை(":8080", வழி)
    go_equivalent: |
      http.ListenAndServe(":8080", http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          w.Write([]byte("வணக்கம்"))
      }))
notes:
  - "Locked 2026-08-13: package பரிமாற்றம் (transfer / exchange)."
  - "கையாளு is a function value, not an interface."
  - "முறைமை = HTTP method (முறை is already struct methods)."
  - "Depends on வலை (Tamil-0.53); blocking I/O parks for GC."
  - "Tamil-0.55: uses *வலை.பிழை for operational failures."
  - "Tamil-0.56: lowercase request headers + opaque exact-path வழிப்படுத்தி."
