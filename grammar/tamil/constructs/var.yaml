id: var
status: specified
subset: Tamil-0
go_inspired: 'var IdentifierList Type [ "=" ExpressionList ]'
go_ebnf: |
  VarDecl = "var" ( VarSpec | "(" { VarSpec ";" } ")" ) .
  VarSpec = IdentifierList ( Type [ "=" ExpressionList ] | "=" ExpressionList ) .
tamil_ebnf: |
  VarDecl = "மாறி" IdentifierList Type [ "=" ExpressionList ] .
tamil_keywords:
  var: மாறி
ast:
  type: VarDecl
  fields: [names, type, values]
semantics: >
  Declares variables with an explicit type (முழுஎண், நிலை, or சரம்).
  Short declaration := is also allowed — see short-var.yaml.
examples:
  - tamil: |
      மாறி x முழுஎண் = 42
    go_equivalent: |
      var x int = 42
